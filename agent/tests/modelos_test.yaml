  gemini:  { nombre: Gemini,  base_url: http://x, key_env: T_GEMINI,  renueva: "se renueva cada día",    ventanas: [ { nombre: "por día", segundos: 86400, peticiones: 250 } ] }
  mistral: { nombre: Mistral, base_url: http://x, key_env: T_MISTRAL, renueva: "se renueva cada mes",    ventanas: [ { nombre: "por mes", segundos: 2592000 } ] }
embeddings: { proveedor: gemini, modelo: emb-test, dimensiones: 768, umbral: 0.15 }
