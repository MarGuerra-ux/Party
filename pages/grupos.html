<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis grupos · Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="../js/party_theme.js"></script>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/party.css" />
</head>

<body data-party-mode="main" data-party-active="grupos">
  <div class="app">
    <a class="app-brand" id="partyBrand"></a>
    <header class="app-top" id="partyTop"></header>
    <aside class="app-side" id="partySide"></aside>

    <main class="app-main">
      <div class="page">

        <div class="page-head">
          <div>
            <h1>Mis grupos</h1>
            <p id="studentInfo">Cargando...</p>
          </div>
          <button class="btn primary" style="margin:0" onclick="showJoinModal()">Unirse con código</button>
        </div>

        <!-- GRUPOS DEL ESTUDIANTE -->
        <section id="misGrupos"><p class="muted-text">Cargando tus grupos...</p></section>

        <!-- TODOS LOS GRUPOS (por sección) -->
        <section id="todosGrupos" style="margin-top:28px">
          <div class="card-head">
            <h3 style="font-size:16px">Explorar grupos por sección</h3>
            <select id="sectionFilter" onchange="cargarGruposPorSeccion(this.value)" style="width:auto;min-width:220px;margin:0">
              <option value="">Selecciona una sección...</option>
            </select>
          </div>
          <div id="gruposSeccion"></div>
        </section>

        <!-- MODAL UNIRSE CON CÓDIGO -->
        <div id="joinModal" class="p-modal-overlay" style="display:none" onclick="if(event.target===this)closeJoinModal()">
          <div class="p-modal">
            <h3>Unirse con código</h3>
            <p>Pídele el código de invitación al dueño del grupo.</p>
            <input id="inviteCodeInput" type="text" placeholder="Ej: INF-G1A"
              style="text-transform:uppercase;letter-spacing:2px;font-size:16px;text-align:center">
            <div class="actions">
              <button class="btn secondary" onclick="closeJoinModal()">Cancelar</button>
              <button class="btn primary" onclick="joinByCode()">Unirse</button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/party_data.js"></script>
  <script src="../js/party_ui.js"></script>
  <script src="../js/grupos.js"></script>
</body>
</html>
